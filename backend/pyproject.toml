[project]
name = "watch-next-backend"
version = "0.1.0"
description = "Watch history aggregator and availability-aware recommender"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    # The driver for every deployed database. Absent until now because nothing
    # but SQLite had ever been connected to; `postgresql+psycopg://` needs it.
    # The binary wheel avoids needing libpq and a compiler on the build host.
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-multipart>=0.0.12",
    "httpx>=0.27",
    "simple-justwatch-python-api>=1.3",
    "rapidfuzz>=3.10",
    "ijson>=3.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Show the full assertion diff for the parser case tables -- truncated output
# makes a failing table-driven test much harder to read.
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
extend-exclude = ["alembic/versions"]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
